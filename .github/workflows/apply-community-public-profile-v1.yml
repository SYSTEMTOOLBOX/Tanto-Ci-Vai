name: Apply Community public profile v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'community-profile.js'
      - 'scripts/apply_community_public_profile_v1.py'
      - '.github/workflows/apply-community-public-profile-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire public Community profile
        run: python scripts/apply_community_public_profile_v1.py
      - name: Validate Community JavaScript
        run: |
          node --check community-profile.js
          node --check community-routes.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html community-routes.js
          git commit -m "Enable public Community profiles [skip ci]"
          git push
