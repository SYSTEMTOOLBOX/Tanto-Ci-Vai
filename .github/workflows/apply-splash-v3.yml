name: Apply single startup splash
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-splash-v3.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove duplicate returning splash
        run: python scripts/apply_splash_v3.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use one startup splash [skip ci]"
          git push
