name: Separate delivery civic

on:
  push:
    branches: [main]
    paths:
      - scripts/separate_delivery_civic.py
      - scripts/run_separate_delivery_civic.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/separate_delivery_civic.py
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate delivery street and civic number [skip ci]"
          git push
