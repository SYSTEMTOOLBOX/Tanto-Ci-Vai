name: Apply Pizzeria category
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_pizzeria_category.py'
      - '.github/workflows/apply-pizzeria-category.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add Pizzeria category
        run: python scripts/apply_pizzeria_category.py
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add Pizzeria with exact map pickup [skip ci]'
            git push
          fi
