name: Apply ultra clean Home

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_ultra_clean_home.py'
      - '.github/workflows/apply-ultra-clean-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Home patch
        run: python scripts/apply_ultra_clean_home.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Home four actions only [skip ci]"
          git push
