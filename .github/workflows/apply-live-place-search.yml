name: Apply live place search

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_live_place_search.py'
      - '.github/workflows/apply-live-place-search.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_live_place_search.py')
          s=p.read_text()
          s=s.replace('pattern.subn(replacement, text, count=1)', 'pattern.subn(lambda m: replacement, text, count=1)')
          p.write_text(s)
          PY
      - name: Apply patch
        run: python scripts/apply_live_place_search.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/apply_live_place_search.py
          git commit -m "Search businesses live by name and area [skip ci]"
          git push
