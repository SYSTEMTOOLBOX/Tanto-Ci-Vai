name: Apply clean Home and profile share

on:
  push:
    branches: [main]
    paths:
      - scripts/clean_home_and_add_share.py
      - .github/workflows/apply-clean-home-share.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/clean_home_and_add_share.py
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean Home and move sharing to Profile [skip ci]"
          git push
