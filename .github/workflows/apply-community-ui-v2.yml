name: Apply Community UI v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'community-ui-v2.js'
      - 'community-document-ui-fix.js'
      - 'community-phone-verification.js'
      - 'satispay-profile-status.js'
      - 'community-profile-compact.js'
      - 'community-profile-photo-only.js'
      - 'scripts/apply_community_ui_v2.py'
      - '.github/workflows/apply-community-ui-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire Community UI v2
        run: python scripts/apply_community_ui_v2.py
      - name: Validate Community UI JavaScript
        run: |
          node --check community-ui-v2.js
          node --check community-document-ui-fix.js
          node --check community-phone-verification.js
          node --check satispay-profile-status.js
          node --check community-profile-compact.js
          node --check community-profile-photo-only.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire compact Community photo editor [skip ci]"
          git push
