name: Apply Maps navigation push

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_maps_navigation_push.py'
      - '.github/workflows/apply-maps-navigation-push.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply_maps_navigation_push.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js supabase/functions/send-help-push/index.ts
          git commit -m "Open SOS notifications in Maps navigation [skip ci]"
          git push
