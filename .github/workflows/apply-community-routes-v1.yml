name: Apply Community routes v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'community-routes.js'
      - 'scripts/apply_community_routes_v1.py'
      - '.github/workflows/apply-community-routes-v1.yml'
      - 'supabase/migrations/20260903222500_community_recurring_trips.sql'
      - 'supabase/migrations/20260903223000_ride_request_contribution_fields.sql'
      - 'supabase/migrations/20260903223500_ride_request_platform_fee.sql'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Community routes script
        run: python scripts/apply_community_routes_v1.py
      - name: Commit index integration
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable Community recurring routes [skip ci]"
          git push
