name: Fix smart runner route order

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_map_plan_route_order.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_map_plan_route_order.py
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize runner multi-stop route [skip ci]"
          git push
