name: Apply pickup pin map

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_pickup_pin_map.py
      - scripts/pickup_pin_map.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_pickup_pin_map.py
      - name: Commit pickup pin map
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add exact pickup pin and simple GPS [skip ci]"
          git push
