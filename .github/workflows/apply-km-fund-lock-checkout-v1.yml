name: Apply km fund-lock checkout V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_km_fund_lock_checkout_v1.py'
      - '.github/workflows/apply-km-fund-lock-checkout-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checkout patch
        run: python scripts/apply_km_fund_lock_checkout_v1.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use 0.50 per km with Satispay fund lock checkout [skip ci]'
          git push
