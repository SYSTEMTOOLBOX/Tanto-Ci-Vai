name: Apply ride request entry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_ride_request_entry.py'
      - '.github/workflows/apply-ride-request-entry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_ride_request_entry.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add dedicated ride request flow [skip ci]'
          git push
