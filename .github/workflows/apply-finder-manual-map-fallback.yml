name: Apply missing place map fallback

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_finder_manual_map_fallback.py
      - scripts/finder_manual_map_fallback.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_finder_manual_map_fallback.py
      - name: Commit exact missing-place map fallback
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Allow exact map pin when place is missing [skip ci]"
          git push
