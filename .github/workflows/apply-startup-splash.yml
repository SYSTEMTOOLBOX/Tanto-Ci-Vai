name: Apply startup splash

on:
  push:
    branches: [main]
    paths:
      - scripts/run_startup_splash.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild splash assets
        run: |
          mkdir -p assets
          cat scripts/splash_assets/video.b64.* | base64 -d > assets/tcv-welcome-5_5s.mp4
          cat scripts/splash_assets/logo.b64.* | base64 -d > assets/tcv-splash-logo.jpg
          test -s assets/tcv-welcome-5_5s.mp4
          test -s assets/tcv-splash-logo.jpg
      - name: Patch app
        run: python scripts/apply_startup_splash.py
      - name: Commit startup splash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r scripts/splash_assets scripts/run_startup_splash.trigger
          git add index.html assets/tcv-welcome-5_5s.mp4 assets/tcv-splash-logo.jpg
          git commit -m "Add first-registration welcome splash [skip ci]"
          git push
