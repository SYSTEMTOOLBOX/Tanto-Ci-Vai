name: Apply startup splash

on:
  push:
    branches: [main]
    paths:
      - scripts/run_startup_splash.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild splash assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          python - <<'PY'
          from pathlib import Path
          import base64, re

          def rebuild(pattern, output):
              chunks = sorted(Path('scripts/splash_assets').glob(pattern))
              if not chunks:
                  raise SystemExit(f'No chunks for {pattern}')
              text = ''.join(p.read_text(encoding='utf-8', errors='ignore') for p in chunks)
              # Keep only Base64 alphabet, remove any padding that may have been
              # introduced inside individual chunks, then pad once at the end.
              text = ''.join(re.findall(r'[A-Za-z0-9+/]', text))
              text += '=' * (-len(text) % 4)
              data = base64.b64decode(text, validate=False)
              Path(output).write_bytes(data)
              if not data:
                  raise SystemExit(f'Empty rebuilt asset: {output}')
              print(output, len(data), 'bytes')

          rebuild('video.b64.*', 'assets/tcv-welcome-5_5s.mp4')
          rebuild('logo.b64.*', 'assets/tcv-splash-logo.jpg')
          PY
          test -s assets/tcv-welcome-5_5s.mp4
          test -s assets/tcv-splash-logo.jpg
          file assets/tcv-welcome-5_5s.mp4 assets/tcv-splash-logo.jpg
      - name: Patch app
        run: python scripts/apply_startup_splash.py
      - name: Commit startup splash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r scripts/splash_assets scripts/run_startup_splash.trigger
          git add index.html assets/tcv-welcome-5_5s.mp4 assets/tcv-splash-logo.jpg
          git commit -m "Add first-registration welcome splash [skip ci]"
          git push
