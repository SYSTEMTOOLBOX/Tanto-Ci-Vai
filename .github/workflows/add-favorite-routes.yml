name: Add favorite routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-favorite-routes.yml'

permissions:
  contents: write

jobs:
  patch-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recurring favorite routes and availability switch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'TRATTE_PREFERITE_V1' in s:
              print('Favorite routes already present')
              raise SystemExit(0)

          css=r'''
          /* TRATTE_PREFERITE_V1 */
          .favbox{margin-top:11px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:0 8px 22px rgba(13,38,84,.07)}
          .avail{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
          .light{width:20px;height:20px;border-radius:50%;background:#20ad69;box-shadow:0 0 0 5px #e5f8ef}.light.off{background:#e45454;box-shadow:0 0 0 5px #fdeaea}
          .avail b{display:block;font-size:12px}.avail p{font-size:9px;line-height:1.35;color:var(--muted);margin:2px 0 0}
          .availbtn{border:0;border-radius:999px;padding:9px 10px;font-size:9px;font-weight:950;background:#e7fbf1;color:#07824e;min-width:66px}.availbtn.off{background:#fdecec;color:#ad3232}
          .favroutes{display:grid;gap:8px;margin-top:11px}.favroute{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px;border-radius:15px;background:#f8faff;border:1px solid #e8eef6}.favroute.muted{opacity:.5}
          .favroute .lab{font-size:8px;font-weight:950;letter-spacing:.1em;color:var(--blue)}.favroute h3{font-size:13px;margin:3px 0}.favroute p{font-size:9px;color:var(--muted);margin:0}.favtoggle{border:0;border-radius:12px;padding:9px 8px;font-size:8px;font-weight:950;background:#0ca66f;color:#fff;min-width:66px}.favtoggle.off{background:#e9edf3;color:#6f7c91}
          .favmatch{margin-top:9px;padding:11px;border-radius:14px;background:#effff8;border:1px solid #d5f4e8;font-size:9px;line-height:1.45;color:#316b58}.favmatch.off{background:#f6f8fb;border-color:var(--line);color:var(--muted)}.favmatch b{color:var(--ink)}
          .favadd{border:0;background:transparent;color:var(--blue);font-size:10px;font-weight:950;padding:5px}
          '''
          s=s.replace('</style>',css+'</style>',1)

          html=r'''<div class="sect"><h2>Le tue tratte preferite</h2><button class="favadd" onclick="openFav()">＋ Aggiungi</button></div><section class="favbox"><div class="avail"><span class="light" id="favLight"></span><div><b id="favDayTitle">Oggi sei disponibile</b><p id="favDayText">Le richieste compatibili possono comparire automaticamente.</p></div><button class="availbtn" id="favDayBtn" onclick="toggleFavDay()">ATTIVO</button></div><div class="favroutes" id="favRoutes"></div><div class="favmatch" id="favMatch"></div></section>'''
          needle='</section><section class="eco">'
          if needle not in s:
              raise SystemExit('Home insertion point not found')
          s=s.replace(needle,'</section>'+html+'<section class="eco">',1)

          js=r'''
          const DEFAULT_FAVS=[
            {id:1,f:'Lugliano',to:'Faruggia',time:'07:30',days:'Lun–Ven',label:'Andata lavoro',on:true},
            {id:2,f:'Faruggia',to:'Lugliano',time:'16:30',days:'Lun–Ven',label:'Rientro a casa',on:true}
          ];
          let FAV=(()=>{try{let x=JSON.parse(localStorage.getItem('tcv_favs')||'null');if(x&&Array.isArray(x.routes))return x}catch(e){}return{today:true,routes:DEFAULT_FAVS.map(x=>({...x}))}})();
          function saveFav(){try{localStorage.setItem('tcv_favs',JSON.stringify(FAV))}catch(e){}}
          function renderFav(){
            if(!document.getElementById('favRoutes'))return;
            let on=!!FAV.today,light=document.getElementById('favLight'),btn=document.getElementById('favDayBtn');
            light.classList.toggle('off',!on);btn.classList.toggle('off',!on);btn.textContent=on?'ATTIVO':'MUTO';
            document.getElementById('favDayTitle').textContent=on?'Oggi sei disponibile':'Oggi sei in pausa';
            document.getElementById('favDayText').textContent=on?'Le richieste compatibili possono comparire automaticamente.':'Nessuna proposta automatica finché non riattivi il semaforo.';
            favRoutes.innerHTML=FAV.routes.map(r=>`<div class="favroute ${(!on||!r.on)?'muted':''}"><div><div class="lab">${r.label.toUpperCase()}</div><h3>${r.f} → ${r.to}</h3><p>${r.days} • passaggio ${r.time}</p></div><button class="favtoggle ${r.on?'':'off'}" onclick="toggleFav(${r.id})">${r.on?'ON • VERDE':'OFF'}</button></div>`).join('');
            let active=FAV.routes.filter(r=>r.on),ret=active.find(r=>r.time==='16:30')||active[0],m=document.getElementById('favMatch');
            if(on&&ret){m.className='favmatch';m.innerHTML=`🔔 <b>1 richiesta compatibile adesso.</b> “Ritirare una piccola spesa” coincide con il tuo ${ret.label.toLowerCase()} ${ret.f} → ${ret.to} delle ${ret.time}. <button class="favadd" onclick="detail(1)">Vedi richiesta →</button>`}
            else{m.className='favmatch off';m.innerHTML='🔕 <b>Notifiche di tratta sospese.</b> Le tratte restano salvate e puoi riattivarle con un tocco.'}
          }
          function toggleFavDay(){FAV.today=!FAV.today;saveFav();renderFav()}
          function toggleFav(id){let r=FAV.routes.find(x=>x.id===id);if(!r)return;r.on=!r.on;saveFav();renderFav()}
          function openFav(){openSheet(`${head('TRATTA PREFERITA','Salva uno spostamento ricorrente','Non dovrai reinserirlo ogni giorno.') }<div class="grid2"><div class="field"><label>PARTENZA</label><input id="ff" placeholder="Es. Lugliano"></div><div class="field"><label>DESTINAZIONE</label><input id="ft" placeholder="Es. Faruggia"></div></div><div class="grid2"><div class="field"><label>ORARIO ABITUALE</label><input id="ftime" type="time" value="16:30"></div><div class="field"><label>GIORNI</label><select id="fdays"><option>Lun–Ven</option><option>Tutti i giorni</option><option>Lun–Sab</option><option>Weekend</option></select></div></div><div class="field"><label>NOME</label><input id="flabel" placeholder="Es. Rientro dal lavoro"></div><div class="notice green">🚦 Verde = l'app confronta automaticamente le nuove richieste con questa tratta. Rosso = giornata libera, nessuna proposta.</div><div class="sactions"><button class="btn outline" onclick="closeSheet()">Annulla</button><button class="btn teal" onclick="saveFavForm()">Salva tratta</button></div>`)}
          function saveFavForm(){let f=(ff?.value||'').trim(),to=(ft?.value||'').trim();if(!f||!to)return;FAV.routes.push({id:Date.now(),f,to,time:ftime?.value||'16:30',days:fdays?.value||'Lun–Ven',label:(flabel?.value||'Tratta preferita').trim(),on:true});saveFav();renderFav();closeSheet()}
          function favoriteMatchAfterPublish(){if(FAV.today&&FAV.routes.some(r=>r.on)){let m=document.getElementById('favMatch');if(m){m.className='favmatch';m.innerHTML='🔔 <b>Nuova richiesta pubblicata.</b> Il motore la confronterebbe subito con tutte le tratte preferite attive.'}}}
          '''
          marker='function publishReq(){let d=S.draft;'
          if marker not in s:
              raise SystemExit('publishReq not found')
          s=s.replace('renderFeed();closeSheet()}\nfunction tripWizard','renderFeed();closeSheet();favoriteMatchAfterPublish()}\nfunction tripWizard',1)
          left,last=s.rsplit('renderFeed();',1)
          s=left+js+'renderFav();renderFeed();'+last
          p.write_text(s,encoding='utf-8')
          print('Favorite routes added')
          PY
      - name: Commit updated demo
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add favorite recurring routes and daily availability"
          git push
