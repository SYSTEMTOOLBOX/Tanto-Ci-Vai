name: Apply SOS v3 accessibility patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_sos_v3.py
      - .github/workflows/apply-sos-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_sos_v3.py
      - name: Commit SOS interface
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make SOS first, automatic and GPS-aware [skip ci]"
          git push
