name: Apply SOS 30s and quick reasons

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_sos_30_presets.py
      - .github/workflows/apply-sos-30-presets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_sos_30_presets.py
      - name: Keep SOS Edge Function source aligned to 30 seconds
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/send-help-push/index.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Date.now() + 60_000', 'Date.now() + 30_000')
          s=s.replace('sleep(61_000)', 'sleep(31_000)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase/functions/send-help-push/index.ts
          git commit -m "Keep SOS 30-second fallback aligned [skip ci]"
          git push
