name: Wire Community ride QR

on:
  push:
    paths:
      - 'scripts/wire-community-ride-qr.py'
      - 'community-ride-qr.js'
      - '.github/workflows/wire-community-ride-qr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire ride QR module
        run: python scripts/wire-community-ride-qr.py
      - name: Validate marker
        run: grep -q 'community-ride-qr.js?v=1' index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable QR boarding journey flow [skip ci]'
          git push
