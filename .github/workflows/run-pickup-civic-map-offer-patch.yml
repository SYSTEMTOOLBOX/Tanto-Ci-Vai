name: Run pickup civic map offer patch

on:
  push:
    branches: [main]
    paths:
      - scripts/run_pickup_civic_map_offer_patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_pickup_civic_map_offer_patch.py
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate pickup civic and open offers from map [skip ci]"
          git push
