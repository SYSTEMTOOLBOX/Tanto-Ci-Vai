name: Implement pharmacy locator

on:
  push:
    paths:
      - '.github/scripts/patch_pharmacy_locator.py'
      - '.github/workflows/implement-pharmacy-locator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python3 .github/scripts/patch_pharmacy_locator.py
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add automatic nearby pharmacy map"
          git push
