name: Apply local pizzeria catalog
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_local_pizzeria_catalog.py'
      - '.github/workflows/apply-local-pizzeria-catalog.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch app
        run: python scripts/apply_local_pizzeria_catalog.py
      - name: Commit app update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add local pizzeria catalog [skip ci]'
          git push
