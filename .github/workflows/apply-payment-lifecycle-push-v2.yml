name: Apply payment lifecycle push V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_payment_lifecycle_push_v2.py'
      - '.github/workflows/apply-payment-lifecycle-push-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply payment lifecycle push patch
        run: python scripts/apply_payment_lifecycle_push_v2.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire delivery and Satispay payment push notifications [skip ci]'
          git push
