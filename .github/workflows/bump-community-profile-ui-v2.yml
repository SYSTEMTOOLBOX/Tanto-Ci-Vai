name: Bump Community profile UI v2

on:
  push:
    paths:
      - 'scripts/bump-community-profile-ui-v2.py'
      - '.github/workflows/bump-community-profile-ui-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Bump Community profile UI cache version
        run: python scripts/bump-community-profile-ui-v2.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Community profile UI [skip ci]"
          git push
