name: Apply Google Places ready

on:
  push:
    paths:
      - 'scripts/apply_google_places_ready.py'
      - '.github/workflows/apply-google-places-ready.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Google Places integration
        run: python scripts/apply_google_places_ready.py
      - name: Commit app update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prepare Google Places search with safe fallback [skip ci]"
          git push origin main
