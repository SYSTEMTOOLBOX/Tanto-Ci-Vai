name: Apply runner wallet

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_runner_wallet.py
      - scripts/runner_wallet.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_runner_wallet.py
      - name: Commit generated wallet UI
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add runner wallet and threshold tracking [skip ci]"
          git push
