name: Apply progressive order numbers

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_order_numbers.py
      - scripts/order_numbers.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_order_numbers.py
      - name: Commit generated order number UI
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show progressive order numbers [skip ci]"
          git push
