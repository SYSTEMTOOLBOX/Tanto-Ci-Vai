name: Apply SOS Home without GPS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sos-home-without-gps.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply_sos_home_without_gps.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep SOS visible on Home without GPS [skip ci]"
          git push
