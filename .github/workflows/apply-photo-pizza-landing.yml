name: Apply photo pizza landing
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_photo_pizza_landing.py'
      - '.github/workflows/apply-photo-pizza-landing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply photo and pizza redesign
        run: python scripts/apply_photo_pizza_landing.py
      - name: Commit landing update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentazione.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Use real photos and add pizza delivery story [skip ci]'
          git push
