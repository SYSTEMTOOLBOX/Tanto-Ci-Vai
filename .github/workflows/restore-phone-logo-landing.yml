name: Restore phone logo landing
on:
  push:
    paths:
      - '.github/restore-phone-logo.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore phone with static logo
        run: python scripts/restore_phone_logo_landing.py
      - name: Commit landing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentazione.html
          git diff --cached --quiet || git commit -m "Restore phone mockup with static logo [skip ci]"
          git push
