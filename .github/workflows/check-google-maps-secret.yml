name: Check Google Maps secret

on:
  push:
    paths:
      - '.github/workflows/check-google-maps-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Google key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ] || [ -n "$GOOGLE_PLACES_API_KEY" ] || [ -n "$MAPS_API_KEY" ]; then
            echo "GOOGLE_KEY_CONFIGURED=yes"
          else
            echo "GOOGLE_KEY_CONFIGURED=no"
            exit 2
          fi
