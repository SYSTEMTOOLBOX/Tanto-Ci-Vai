name: Patch requester runner flow

on:
  push:
    paths:
      - 'scripts/patch_requester_runner_flow.py'
      - 'scripts/productionize_app.py'
      - '.github/workflows/patch-requester-runner-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app flow
        run: python3 scripts/patch_requester_runner_flow.py
      - name: Remove demo labels and enable live GPS
        run: python3 scripts/productionize_app.py
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No app changes"
          else
            git commit -m "Make app production-facing with live GPS"
            git push
          fi
