name: Apply Community anti-profit cost

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_community_antiprofit_cost.py'
      - '.github/workflows/apply-community-antiprofit-cost.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Community anti-profit model
        run: python scripts/apply_community_antiprofit_cost.py
      - name: Validate Community JavaScript
        run: node --check community-routes.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-routes.js index.html
          git commit -m "Add Community anti-profit vehicle cost cap [skip ci]"
          git push
