name: Upgrade visual how-it-works
on:
  push:
    paths:
      - '.github/workflows/upgrade-steps-visual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Upgrade how-it-works section
        run: python .github/scripts/upgrade-steps-visual.py
      - name: Commit landing update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentazione.html
          git diff --cached --quiet || git commit -m 'Redesign how-it-works section with visual cards [skip ci]'
          git push
