name: Apply extra large SOS button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sos-elder-big.yml'
      - 'scripts/apply_sos_elder_big.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply accessibility patch
        run: python scripts/apply_sos_elder_big.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make SOS button extra large [skip ci]"
          git push
