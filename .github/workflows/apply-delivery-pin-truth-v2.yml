name: Apply delivery pin truth v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_delivery_pin_truth_v2.py'
      - '.github/workflows/apply-delivery-pin-truth-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply delivery fix
        run: python scripts/apply_delivery_pin_truth_v2.py
      - name: Validate delivery fix
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '/* DELIVERY_PIN_TRUTH_V2 */',
            'TCV_DELIVERY_PIN_EXACT',
            'Nessuna via sicura trovata in questa località',
            'Uso il punto esatto scelto sulla mappa',
          ]
          missing=[x for x in checks if x not in text]
          if missing:
            raise SystemExit('Validation failed: '+', '.join(missing))
          print('Delivery pin truth v2 validated')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/apply_delivery_pin_truth_v2.py
          git commit -m "Trust exact delivery pins and fix address suggestions [skip ci]"
          git push
