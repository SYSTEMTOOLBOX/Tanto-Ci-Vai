name: Fix SOS startup load

on:
  push:
    paths:
      - 'scripts/fix_sos_startup_load.py'
      - '.github/workflows/fix-sos-startup-load.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/fix_sos_startup_load.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load SOS immediately on app startup [skip ci]'
          git push
