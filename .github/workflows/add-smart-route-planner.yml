name: Add smart route planner

on:
  push:
    paths:
      - '.github/workflows/add-smart-route-planner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route planner into app
        run: python3 .github/scripts/patch_smart_route.py
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add smart car foot bike route planner"
          git push
