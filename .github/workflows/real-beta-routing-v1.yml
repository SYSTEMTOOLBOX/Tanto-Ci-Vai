name: Real beta routing v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-beta-routing-v1.yml'

permissions:
  contents: write

jobs:
  patch-real-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable real GPS geocoding routing and beta sharing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'REAL_BETA_ROUTING_V1' in s:
              print('Real beta already enabled')
              raise SystemExit(0)

          s=s.replace('Entra nella demo','Entra nella beta reale')
          s=s.replace('● DEMO','● BETA REALE')
          s=s.replace('Demo interattiva','Beta territoriale')
          s=s.replace('La mappa demo usa dati OpenStreetMap.','La mappa usa OpenStreetMap e punti geocodificati realmente.')

          css=r'''
          /* REAL_BETA_ROUTING_V1 */
          .realbadge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:#e9fff8;color:#08795c;font-size:9px;font-weight:950}
          .loadingbox{padding:18px;border-radius:18px;background:#f5f9ff;border:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);line-height:1.5}
          .routefacts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.routefacts div{padding:10px;border-radius:14px;background:#f5f8fc;border:1px solid var(--line)}.routefacts b{display:block;font-size:14px}.routefacts span{font-size:8px;color:var(--muted)}
          .sharebox{padding:13px;border:1px solid #d5f4e8;background:#effff8;border-radius:16px;margin-top:10px}.sharebox b{font-size:12px}.sharebox p{font-size:9px;line-height:1.45;color:#40685c;margin:4px 0 9px}
          .mapstatus{padding:9px 11px;border-radius:12px;background:#f6f8fb;border:1px solid var(--line);font-size:9px;color:var(--muted);margin-bottom:8px}
          .gpsbtn{width:100%;border:1px dashed #9dbcf3;background:#f2f7ff;color:var(--blue);border-radius:13px;padding:10px;font-size:10px;font-weight:900;margin-top:7px}
          '''
          s=s.replace('</style>',css+'</style>',1)

          js=r'''
          /* REAL_BETA_ROUTING_V1 */
          const REAL_TEST_ADDRESS='Carrefour Express, Via Casale 49, 10020 San Sebastiano da Po TO, Italia';
          const PROFILE_KEY='tcv_beta_profile_v1';
          const GEO_CACHE_KEY='tcv_geo_cache_v1';
          let PROFILE=null, REAL_GPS=null, REAL_TRIP=null, REAL_MAP_MARKERS=[];
          S.trip={f:'Saluggia, TO',to:'Lauriano, TO',w:'Oggi'};
          S.reqs=[{id:1,k:'RITIRO',t:'Ritiro test al Carrefour Express',d:'Richiesta beta territoriale: ritira un piccolo pacco/spesa nel punto vendita reale e portalo a Lauriano.',f:REAL_TEST_ADDRESS,to:'Lauriano, TO',km:'da calcolare',w:'Oggi',r:4,p:'Test beta',rate:'Punto reale • percorso reale',i:'BT',test:true}];

          function loadProfile(){try{PROFILE=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null')}catch(e){PROFILE=null}return PROFILE}
          function openSignup(next=''){
            openSheet(`${head('BETA TERRITORIALE','Crea il tuo profilo','Per ora il profilo viene salvato su questo telefono. Il database condiviso arriverà nel passaggio successivo.')}
              <div class="field"><label>NOME</label><input id="pname" placeholder="Es. Anna"></div>
              <div class="field"><label>TELEFONO</label><input id="pphone" inputmode="tel" placeholder="Numero di telefono"></div>
              <div class="field"><label>COMUNE / ZONA</label><input id="ptown" value="Lauriano" placeholder="Es. Lauriano"></div>
              <div class="notice green">✓ Serve per identificare chi pubblica e chi accetta durante il test sul territorio.</div>
              <button class="btn teal full" style="margin-top:12px" onclick="saveBetaProfile('${next}')">Entra nella beta</button>`)
          }
          function saveBetaProfile(next){let name=(pname?.value||'').trim(),phone=(pphone?.value||'').trim(),town=(ptown?.value||'').trim();if(!name){alert('Inserisci il nome.');return}PROFILE={name,phone,town,createdAt:Date.now()};localStorage.setItem(PROFILE_KEY,JSON.stringify(PROFILE));closeSheet();refreshBetaUI();if(next==='help')setTimeout(()=>reqWizard(1),100);if(next==='go')setTimeout(()=>tripWizard(1),100)}
          window.enter=function(x){splash.classList.add('hidden');if(!loadProfile()){setTimeout(()=>openSignup(x||''),80);return}refreshBetaUI();if(x==='help')setTimeout(()=>reqWizard(1),100);if(x==='go')setTimeout(()=>tripWizard(1),100)};
          function refreshBetaUI(){loadProfile();let a=document.querySelector('.avatar');if(a&&PROFILE?.name)a.textContent=PROFILE.name.slice(0,2).toUpperCase();let p=document.querySelector('.pilot');if(p)p.textContent='● BETA REALE'}
          window.renderProfile=function(){loadProfile();let n=PROFILE?.name||'Profilo beta',ph=PROFILE?.phone||'Non inserito',town=PROFILE?.town||'Zona non indicata';profile.innerHTML=`<div class="pagehead"><div class="k">PROFILO BETA</div><h2>${esc(n)}</h2><p>Profilo salvato su questo dispositivo.</p></div><div class="req"><div class="sum"><div><span>Telefono</span><b>${esc(ph)}</b></div><div><span>Zona</span><b>${esc(town)}</b></div><div><span>Stato</span><b>Beta attiva</b></div></div><button class="btn outline full" onclick="openSignup('')">Modifica profilo</button></div><div class="notice" style="margin-top:10px">Per sincronizzare automaticamente richieste e utenti fra telefoni diversi collegheremo un database online. Mappa, GPS e routing di questa beta sono invece già reali.</div>`}

          function geoCache(){try{return JSON.parse(localStorage.getItem(GEO_CACHE_KEY)||'{}')}catch(e){return{}}}
          function setGeoCache(k,v){let c=geoCache();c[k]=v;try{localStorage.setItem(GEO_CACHE_KEY,JSON.stringify(c))}catch(e){}}
          let geoChain=Promise.resolve(), lastGeoAt=0;
          function geocodeReal(q){
            q=String(q||'').trim();let m=q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);if(m)return Promise.resolve({lat:+m[1],lng:+m[2],label:'Posizione GPS'});
            let key=q.toLowerCase(),c=geoCache();if(c[key])return Promise.resolve(c[key]);
            geoChain=geoChain.then(async()=>{let wait=Math.max(0,1100-(Date.now()-lastGeoAt));if(wait)await new Promise(r=>setTimeout(r,wait));lastGeoAt=Date.now();let u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=it&q='+encodeURIComponent(q);let res=await fetch(u,{headers:{'Accept-Language':'it'}});if(!res.ok)throw new Error('Geocodifica non disponibile');let a=await res.json();if(!a.length)throw new Error('Indirizzo non trovato: '+q);let v={lat:+a[0].lat,lng:+a[0].lon,label:a[0].display_name};setGeoCache(key,v);return v});return geoChain
          }
          async function routeOSRM(points){let coords=points.map(p=>`${p.lng},${p.lat}`).join(';');let u=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`;let res=await fetch(u);if(!res.ok)throw new Error('Routing non disponibile');let j=await res.json();if(j.code!=='Ok'||!j.routes?.length)throw new Error('Percorso non trovato');return j.routes[0]}
          function useGpsStart(){if(!navigator.geolocation){alert('GPS non disponibile.');return}navigator.geolocation.getCurrentPosition(pos=>{REAL_GPS={lat:pos.coords.latitude,lng:pos.coords.longitude};let el=document.getElementById('tf');if(el)el.value=`${REAL_GPS.lat.toFixed(6)},${REAL_GPS.lng.toFixed(6)}`},()=>alert('Consenti la posizione al browser per usare il GPS.'),{enableHighAccuracy:true,timeout:12000,maximumAge:15000})}

          window.tripWizard=function(n){let d=S.trip;if(n===1)openSheet(`${head('STO GIÀ ANDANDO','Inserisci il tragitto reale','GPS, geocodifica e percorso stradale verranno calcolati realmente.')}
            <div class="field"><label>PARTENZA</label><input id="tf" value="${esc(d.f)}" placeholder="Es. Saluggia"></div><button class="gpsbtn" onclick="useGpsStart()">📍 Usa la mia posizione GPS come partenza</button>
            <div class="field"><label>DESTINAZIONE</label><input id="tt" value="${esc(d.to)}" placeholder="Es. Lauriano"></div>
            <div class="field"><label>QUANDO</label><input id="tw" value="${esc(d.w)}"></div>
            <div class="notice green">🗺️ Prova già pronta: Saluggia → Lauriano. L'app controllerà se il ritiro al Carrefour di San Sebastiano da Po conviene lungo la strada.</div>
            <div class="sactions"><button class="btn outline" onclick="closeSheet()">Annulla</button><button class="btn teal" onclick="realTripSearch()">Calcola percorso reale →</button></div>`)};
          window.saveTrip=function(){S.trip.f=tf?.value||S.trip.f;S.trip.to=tt?.value||S.trip.to;S.trip.w=tw?.value||S.trip.w};
          async function realTripSearch(){saveTrip();openSheet(`${head('CALCOLO REALE','Sto controllando la strada…','Geocodifica e routing in corso.')}<div class="loadingbox">📍 Cerco partenza e destinazione<br>🛣️ Calcolo il percorso stradale<br>📦 Confronto i ritiri lungo la tratta</div>`);try{let start=await geocodeReal(S.trip.f),end=await geocodeReal(S.trip.to),baseline=await routeOSRM([start,end]),matches=[];for(let r of S.reqs){try{let pickup=await geocodeReal(r.f),delivery=await geocodeReal(r.to),detour=await routeOSRM([start,pickup,delivery,end]);let devKm=Math.max(0,(detour.distance-baseline.distance)/1000),extraMin=Math.max(0,(detour.duration-baseline.duration)/60);r.km=`+${devKm.toFixed(1).replace('.',',')} km deviazione`;matches.push({r,pickup,delivery,detour,devKm,extraMin})}catch(e){console.warn(e)}}REAL_TRIP={start,end,baseline,matches};showRealMatches(matches,baseline)}catch(e){openSheet(`${head('PERCORSO NON TROVATO','Non sono riuscito a calcolarlo',esc(e.message))}<div class="notice yellow">Controlla i nomi dei luoghi o la connessione e riprova.</div><button class="btn outline full" style="margin-top:10px" onclick="tripWizard(1)">← Torna al tragitto</button>`)}}
          function showRealMatches(matches,baseline){let compatible=matches.filter(x=>x.devKm<=15&&x.extraMin<=30);let baseKm=baseline.distance/1000,baseMin=baseline.duration/60;openSheet(`${head('MATCH DI PERCORSO',`${compatible.length} richiesta${compatible.length===1?'':'e'} compatibile${compatible.length===1?'':'i'}`,'Calcolo effettuato sulla rete stradale reale.')}
            <div class="match"><div class="big">${esc(S.trip.f)} → ${esc(S.trip.to)}</div><p>Percorso base reale</p><div class="mk"><div><b>${baseKm.toFixed(1).replace('.',',')} km</b><span>distanza</span></div><div><b>${Math.round(baseMin)} min</b><span>tempo stimato</span></div><div><b>${compatible.length}</b><span>ritiri compatibili</span></div></div></div>
            ${compatible.length?compatible.map(x=>`<div class="req reqclick" style="margin-bottom:8px" onclick="detail(${x.r.id})"><div class="reqhead"><span class="kind">${x.r.k}</span><span class="dist">${x.r.km}</span></div><h3>${esc(x.r.t)}</h3><p>${esc(x.r.f)}</p><div class="meta"><span class="pill">+ ${Math.round(x.extraMin)} min</span><span class="pill money">${euro(x.r.r)}</span></div><div class="reqopen">Apri e scegli questa →</div></div>`).join(''):`<div class="notice yellow">Nessuna richiesta abbastanza vicina alla tratta secondo i limiti della beta.</div>`}
            <button class="btn outline full" style="margin:4px 0 8px" onclick="openTripMap()">🗺️ Apri percorso e ritiri sulla mappa</button>
            <div class="sactions"><button class="btn outline" onclick="tripWizard(1)">← Modifica</button>${compatible.length>1?`<button class="btn teal" onclick="bundleReal()">Accetta tutte (${compatible.length})</button>`:'<span></span>'}</div>`)}
          function bundleReal(){let a=(REAL_TRIP?.matches||[]).filter(x=>x.devKm<=15&&x.extraMin<=30);if(!a.length)return;let ids=new Set(a.map(x=>x.r.id)),sum=a.reduce((z,x)=>z+x.r.r,0);S.missions.unshift({id:Date.now(),t:`${S.trip.f} → ${S.trip.to}`,n:a.length,r:sum,s:'In corso'});S.reqs=S.reqs.filter(r=>!ids.has(r.id));renderFeed();closeSheet();page('missions')}

          window.detail=function(id){let r=S.reqs.find(x=>x.id===id);if(!r)return;let mt=REAL_TRIP?.matches?.find(x=>x.r.id===id);openSheet(`${head('DETTAGLIO COMMISSIONE',esc(r.t),`${esc(r.p)} • ${esc(r.rate)}`)}<div class="route"><div><small>RITIRO REALE</small><br>${esc(r.f)}</div><div><small>CONSEGNA</small><br>${esc(r.to)}</div></div><p style="font-size:11px;color:var(--muted);line-height:1.5">${esc(r.d)}</p>${mt?`<div class="routefacts"><div><b>+${mt.devKm.toFixed(1).replace('.',',')} km</b><span>deviazione reale</span></div><div><b>+${Math.round(mt.extraMin)} min</b><span>tempo extra</span></div><div><b>${euro(r.r)}</b><span>compenso</span></div></div>`:`<div class="sum"><div><span>Quando</span><b>${esc(r.w)}</b></div><div class="total"><span>Compenso</span><b>${euro(r.r)}</b></div></div>`}<div class="navgrid"><button class="btn outline full" onclick="openTripMap(${r.id})">🗺️ Vedi sulla mappa</button><button class="btn outline full" onclick="navTo(${r.id})">🧭 Naviga al ritiro</button></div><button class="btn teal full" style="margin-top:8px" onclick="accept(${r.id})">Sì, prendo questa</button>${r.test?'':`<button class="btn outline full" style="margin-top:8px" onclick="shareReq(${r.id})">↗ Condividi richiesta beta</button>`}`)};
          window.navTo=async function(id){let r=S.reqs.find(x=>x.id===id);if(!r)return;try{let p=REAL_TRIP?.matches?.find(x=>x.r.id===id)?.pickup||await geocodeReal(r.f);window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving`,'_blank')}catch(e){window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.f)}`,'_blank')}};

          window.openReqMap=function(){openSheet(`${head('MAPPA RICHIESTE','Richieste reali sulla mappa','Sposta la mappa, usa il GPS e premi “Cerca in questa zona”.')}<div class="maptools"><button class="maptool primarymap" onclick="locateMeReal()">◎ La mia posizione</button><button class="maptool" onclick="searchThisArea()">🔎 Cerca in questa zona</button><button class="maptool" onclick="fitRealRequests()">📦 Mostra tutte</button></div><div id="mapSearchStatus" class="mapstatus">Carico i punti reali…</div><div id="reqMap"></div><div class="notice green">I pin vengono ottenuti dagli indirizzi reali delle richieste. Tocca un pin per aprire la commissione.</div>`);setTimeout(initRealReqMap,120)};
          async function initRealReqMap(){if(typeof L==='undefined'||!document.getElementById('reqMap'))return;reqMapInstance=L.map('reqMap',{zoomControl:true}).setView([45.19,7.99],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(reqMapInstance);REAL_MAP_MARKERS=[];for(let r of S.reqs){try{let q=await geocodeReal(r.f),marker=L.marker([q.lat,q.lng]).addTo(reqMapInstance);marker.bindPopup(`<div class="mappop"><b>${escMap(r.t)}</b><p>${escMap(r.f)} • ${euro(r.r)}</p><button onclick="detail(${r.id})">Apri richiesta</button></div>`);REAL_MAP_MARKERS.push({marker,r,q})}catch(e){console.warn(e)}}fitRealRequests();let st=document.getElementById('mapSearchStatus');if(st)st.textContent=`${REAL_MAP_MARKERS.length} richiesta/e geolocalizzata/e`}
          function fitRealRequests(){if(!reqMapInstance||!REAL_MAP_MARKERS.length)return;reqMapInstance.fitBounds(REAL_MAP_MARKERS.map(x=>[x.q.lat,x.q.lng]),{padding:[35,35],maxZoom:14})}
          function searchThisArea(){if(!reqMapInstance)return;let b=reqMapInstance.getBounds(),inside=REAL_MAP_MARKERS.filter(x=>b.contains([x.q.lat,x.q.lng]));REAL_MAP_MARKERS.forEach(x=>{if(b.contains([x.q.lat,x.q.lng])){if(!reqMapInstance.hasLayer(x.marker))x.marker.addTo(reqMapInstance)}});let st=document.getElementById('mapSearchStatus');if(st)st.textContent=`${inside.length} richiesta/e visibile/i in questa zona`}
          function locateMeReal(){if(!navigator.geolocation){alert('GPS non disponibile.');return}navigator.geolocation.getCurrentPosition(pos=>{let ll=[pos.coords.latitude,pos.coords.longitude];REAL_GPS={lat:ll[0],lng:ll[1]};L.circleMarker(ll,{radius:9,weight:4,fillOpacity:.9}).addTo(reqMapInstance).bindPopup('La tua posizione GPS').openPopup();reqMapInstance.setView(ll,14)},()=>alert('Consenti la posizione al browser.'),{enableHighAccuracy:true,timeout:12000,maximumAge:15000})}
          window.locateMe=locateMeReal;

          function openTripMap(focusId=null){if(!REAL_TRIP){openReqMap();return}openSheet(`${head('PERCORSO REALE',`${esc(S.trip.f)} → ${esc(S.trip.to)}`,'La linea segue la strada calcolata dal motore di routing.')}<div id="reqMap"></div><div class="notice green">Blu: percorso base. Il percorso con ritiro mostra la deviazione effettiva della richiesta selezionata.</div>`);setTimeout(()=>drawTripMap(focusId),120)}
          function drawGeoRoute(map,route,opts){let latlngs=route.geometry.coordinates.map(c=>[c[1],c[0]]);return L.polyline(latlngs,opts).addTo(map)}
          function drawTripMap(focusId){if(typeof L==='undefined'||!REAL_TRIP)return;reqMapInstance=L.map('reqMap').setView([REAL_TRIP.start.lat,REAL_TRIP.start.lng],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(reqMapInstance);let base=drawGeoRoute(reqMapInstance,REAL_TRIP.baseline,{weight:6,opacity:.7});L.marker([REAL_TRIP.start.lat,REAL_TRIP.start.lng]).addTo(reqMapInstance).bindPopup('Partenza');L.marker([REAL_TRIP.end.lat,REAL_TRIP.end.lng]).addTo(reqMapInstance).bindPopup('Destinazione');let arr=focusId?REAL_TRIP.matches.filter(x=>x.r.id===focusId):REAL_TRIP.matches;arr.forEach(x=>{drawGeoRoute(reqMapInstance,x.detour,{weight:4,opacity:.45,dashArray:'8,7'});L.marker([x.pickup.lat,x.pickup.lng]).addTo(reqMapInstance).bindPopup(`<b>${escMap(x.r.t)}</b><br>Ritiro: ${escMap(x.r.f)}`)});reqMapInstance.fitBounds(base.getBounds(),{padding:[28,28]})}

          function encodeReq(r){return btoa(unescape(encodeURIComponent(JSON.stringify({k:r.k,t:r.t,d:r.d,f:r.f,to:r.to,w:r.w,r:r.r,p:r.p,i:r.i,id:Date.now()}))))}
          function decodeReq(v){return JSON.parse(decodeURIComponent(escape(atob(v))))}
          function sharedUrl(r){let u=new URL(location.origin+location.pathname);u.searchParams.set('tcv_req',encodeReq(r));return u.toString()}
          window.shareReq=async function(id){let r=S.reqs.find(x=>x.id===id);if(!r)return;let url=sharedUrl(r);try{if(navigator.share)await navigator.share({title:'Tanto ci vai? - richiesta beta',text:`${r.t} • ${r.f} → ${r.to}`,url});else{await navigator.clipboard.writeText(url);alert('Link richiesta copiato.')}}catch(e){}}
          function importSharedReq(){let v=new URLSearchParams(location.search).get('tcv_req');if(!v)return;try{let r=decodeReq(v);r.id=Date.now()+7;r.rate='Richiesta condivisa da altro telefono';r.test=false;if(!S.reqs.some(x=>x.f===r.f&&x.to===r.to&&x.t===r.t))S.reqs.unshift(r)}catch(e){console.warn('Link richiesta non valido')}}
          window.publishReq=function(){loadProfile();let d=S.draft,r={id:Date.now(),k:d.k.toUpperCase(),t:d.d||'Nuova richiesta',d:d.d||'Richiesta appena pubblicata.',f:d.f||'Punto di ritiro',to:d.to||'Indirizzo di consegna',km:'da calcolare',w:d.w,r:d.r,p:PROFILE?.name||'Utente beta',rate:'Richiesta beta locale',i:(PROFILE?.name||'U').slice(0,2).toUpperCase(),test:false};S.reqs.unshift(r);renderFeed();favoriteMatchAfterPublish();openSheet(`${head('RICHIESTA PUBBLICATA','Pronta per il test','Su questo telefono è già attiva. Per passarla a un secondo telefono usa il link beta.') }<div class="sharebox"><b>📲 Test fra due telefoni</b><p>Condividi la richiesta: chi apre il link la vedrà nella propria mappa e potrà calcolare il tragitto reale.</p><button class="btn teal full" onclick="shareReq(${r.id})">Condividi richiesta</button></div><button class="btn outline full" style="margin-top:8px" onclick="closeSheet()">Chiudi</button>`)};

          importSharedReq();refreshBetaUI();renderFeed();
          '''
          marker='renderFav();renderFeed();'
          left,right=s.rsplit(marker,1)
          s=left+js+'\n'+marker+right
          p.write_text(s,encoding='utf-8')
          print('Real beta routing enabled')
          PY
      - name: Commit real beta
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable real GPS map routing beta"
          git push
